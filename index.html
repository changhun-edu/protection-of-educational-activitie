<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>교육활동 침해 판별 도우미</title>
<style>
:root{
  color-scheme: light;
  --font-main:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",sans-serif;
  --bg:#F6F8FB; --card:#FFFFFF; --ink:#18212B; --muted:#5A6573; --faint:#8A95A3; --line:#E2E8F0;
  --primary:#2160C4; --primary-soft:#EAF1FC;
  --high:#C2410C; --high-bg:#FFF2E8;
  --review:#9A6200; --review-bg:#FEF6DE;
  --no:#5B6676; --no-bg:#F0F3F7;
  --urgent:#B42318; --urgent-bg:#FEF1F0;
  --ok:#1F7A5A;
  --hdr:104px;
}
*{box-sizing:border-box}
[id]{scroll-margin-top:calc(var(--hdr) + 8px)}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-main);line-height:1.65;word-break:keep-all;overflow-wrap:break-word;font-weight:400}
button,input,select,textarea{font-family:var(--font-main);font-size:1rem;color:var(--ink)}
svg.i{width:1.15em;height:1.15em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* 머리글과 메뉴 */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--primary)}
header.top .row1{display:flex;align-items:center;min-height:52px;padding-top:3px}
.logo{background:none;border:0;padding:6px 0;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.logo .mark{width:24px;height:24px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
.logo .mark svg{width:15px;height:15px;stroke-width:2.4}
.topnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.topnav::-webkit-scrollbar{display:none}
.topnav button{flex:0 0 auto;border:0;background:none;border-radius:8px;padding:6px 11px;font-size:.92rem;color:var(--muted);cursor:pointer;font-weight:600}
.topnav button:hover{background:var(--bg);color:var(--ink)}
.topnav button.on{background:var(--primary-soft);color:var(--primary)}

main{padding:24px 0 56px}
main.has-bar{padding-bottom:120px}
h1{font-size:1.55rem;line-height:1.35;margin:.2em 0 .35em;font-weight:800;letter-spacing:-.025em}
h2{font-size:1.15rem;line-height:1.4;margin:1.8em 0 .6em;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:.2em 0 .3em;font-weight:700}
p{margin:.3em 0 .8em}
.lead{color:var(--muted);margin-bottom:1.2em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.ref{font-size:.8rem;color:var(--faint);margin-top:8px}
.ref a{color:inherit;text-decoration:none;border-bottom:1px dotted #B8C2CE}
.ref a:hover{color:var(--primary)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}

/* 긴급 띠 */
.sos{background:#fff;border:1px solid var(--line);border-left:4px solid var(--urgent);border-radius:12px;padding:12px 16px;margin:4px 0 18px}
.sos .t{font-weight:700;color:var(--urgent);display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.95rem}
.sos .acts{display:flex;flex-wrap:wrap;gap:8px}
.sos ol{margin:0;padding-left:1.4em;font-size:.95rem}
.sos ol li{margin:.2em 0}
.sos ol li b{color:var(--ink)}
.sos .call112{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:3px 12px;border:1px solid var(--urgent);border-radius:8px;color:#fff;background:var(--urgent);font-weight:700;text-decoration:none;font-size:.9rem;vertical-align:1px}
.sos .after{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.sos .after a,.sos .after button{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.9rem}
.sos .acts a,.sos .acts button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;font-size:.95rem;border:1px solid var(--urgent)}
.sos .acts .r{background:var(--urgent);color:#fff}
.sos .acts .w{background:#fff;color:var(--urgent)}
.region{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;color:var(--muted)}
select{min-height:40px;border:1px solid #CBD5E1;border-radius:8px;padding:4px 10px;background:#fff}

/* 홈 메뉴 */
.menu{display:grid;gap:10px;margin:16px 0}
.menu-card{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.menu-card:hover,.menu-card:focus-visible{border-color:var(--primary);box-shadow:0 2px 10px rgba(33,96,196,.08);outline:none}
.menu-card .ic{width:24px;height:28px;color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.menu-card .ic svg{width:22px;height:22px}
.menu-card .t{font-weight:700;display:block;font-size:1.02rem}
.menu-card .d{color:var(--muted);font-size:.9rem;display:block;margin-top:2px}
.menu-card.primary{background:var(--primary);border-color:var(--primary);padding:20px;align-items:center}
.menu-card.primary:hover,.menu-card.primary:focus-visible{background:#1B52AA;box-shadow:0 4px 16px rgba(33,96,196,.25)}
.menu-card.primary .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff}
.menu-card.primary .t{color:#fff;font-size:1.15rem}
.menu-card.primary .d{color:#DCE7F8}
.menu-card .go{margin-left:auto;color:#fff;opacity:.85}
.menu.sub{grid-template-columns:1fr 1fr;margin-top:0}
.menu.sub .menu-card{padding:14px}
@media (max-width:560px){.menu.sub{grid-template-columns:1fr}.menu.sub .menu-card .d{font-size:.85rem}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{background:#C9D3E0;border-color:#C9D3E0;color:#fff;cursor:not-allowed}
.btn.ghost:disabled{background:#fff;color:var(--faint);border-color:var(--line)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.btn-row .btn{flex:1 1 180px}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;font-size:.85rem}

/* 하단 고정 막대 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:10px}
.bar .btn{min-height:52px}
.bar .prev{flex:0 0 96px}
.bar .next{flex:1}

/* 단계 표시 */
.stages{display:flex;gap:4px;margin:0 0 6px;padding:0;list-style:none}
.stages li{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stages li.done{background:var(--primary)}
.stages li.cur{background:var(--primary);opacity:.45}
.stage-label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stage-label b{color:var(--primary);font-weight:700}
.q-title{font-size:1.35rem;font-weight:800;line-height:1.4;margin:18px 0 4px;letter-spacing:-.02em}
.q-help{color:var(--muted);font-size:.92rem;margin-bottom:10px}
.editing{font-size:.85rem;background:var(--review-bg);color:var(--review);border-radius:8px;padding:6px 10px;margin-top:10px;display:inline-block}

/* 선택지 */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:#A9C1E8}
.opt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.opt .mk{flex:0 0 22px;height:22px;margin-top:2px;border:2px solid #C3CDD9;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.opt.multi .mk{border-radius:6px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .mk{border-color:var(--primary);background:var(--primary)}
.opt.sel .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi.sel .mk::after{width:10px;height:6px;border-radius:0;background:none;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.opt .l{font-weight:600;display:block}
.opt .s{color:var(--muted);font-size:.88rem;display:block;margin-top:2px}
.opt.unsure{border-style:dashed}
.opt.unsure .l{font-weight:500;color:var(--muted)}

/* 접기 */
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}
details>summary{cursor:pointer;padding:14px 16px;font-weight:600;display:flex;align-items:center;gap:10px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:8px;height:8px;border:solid var(--faint);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s;flex:0 0 auto}
details[open]>summary::after{transform:rotate(-135deg)}
details .inner{padding:0 16px 16px}
.cnt{font-size:.78rem;font-weight:700;background:var(--primary);color:#fff;border-radius:99px;padding:1px 8px}
.cnt.zero{background:var(--line);color:var(--muted)}

/* 결과 */
.assure{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);border:1px solid #C9DAF4;border-radius:12px;padding:12px 14px;margin:8px 0 12px;font-size:.95rem}
.assure svg{color:var(--primary);margin-top:3px}
.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.summary .big{font-size:1.2rem;font-weight:800;line-height:1.45;letter-spacing:-.01em}
.assure-line{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;color:var(--muted);background:var(--primary-soft);border-radius:10px;padding:9px 12px;margin:-4px -4px 14px}
.assure-line svg{color:var(--primary);margin-top:3px}
.assure-line b{color:var(--ink)}
.big-chips .chip{font-size:1rem;padding:5px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.85rem;font-weight:600;border-radius:99px;padding:3px 10px}
.lv-high{background:var(--primary);color:#fff}
.lv-review{background:#fff;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.lv-no{background:var(--no-bg);color:var(--no)}
.now{border-radius:14px;padding:16px 18px;margin:12px 0;background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary)}
.now.urgent{background:var(--urgent-bg);border-color:#F4C7C3;border-left-color:var(--urgent)}
.now h3{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.now.urgent h3{color:var(--urgent)}
.now ol{margin:0;padding-left:1.3em}
.now li{margin:.3em 0}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.rcard .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rcard .why{margin:.4em 0 .2em;padding-left:1.1em}
.rcard .why li{margin:.25em 0}
.basis{background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:.86rem}
.basis .bt{font-weight:600;color:var(--muted);margin-bottom:2px}
.basis .bl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 0}
.basis .bl span{color:var(--ink)}
.rcard .more{margin-top:10px;font-size:.9rem}
.rcard .more summary{padding:10px 12px;font-size:.9rem}
.rcard .more .inner{padding:0 12px 12px}
.norow{padding:12px 0;border-top:1px solid var(--line)}
.norow:first-child{border-top:0}
.norow b{font-weight:600}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.note.gray{border-left-color:var(--no)}
.ans-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.ans-row:first-child{border-top:0}
.ans-row .q{color:var(--muted);display:block;font-size:.82rem}

/* 용어 풀이 */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted #8FA6C9;text-underline-offset:3px;cursor:help}
#termBox{position:fixed;left:0;right:0;bottom:16px;z-index:60;display:none}
#termBox.on{display:block}
#termBox .in{max-width:688px;margin:0 auto;background:#18212B;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:flex-start}
#termBox b{display:block;margin-bottom:2px}
#termBox button{margin-left:auto;background:none;border:0;color:#C9D3E0;cursor:pointer;font-size:1.2rem;line-height:1}

/* 담당자 */
.casebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.casebar select{flex:1 1 180px;min-height:44px;font-weight:600}
.casebar .btn{flex:0 0 auto}
.kebab{position:relative;border:0;background:none;margin:0}
.kebab>summary{min-height:40px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;justify-content:center;font-size:1.2rem;line-height:1;background:#fff}
.kebab>summary::after{display:none}
.kebab .menu-pop{position:absolute;right:0;top:46px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(24,33,43,.12);padding:6px;min-width:200px}
.kebab .menu-pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;font-size:.92rem}
.kebab .menu-pop button:hover{background:var(--bg)}
.kebab .menu-pop .danger{color:var(--urgent);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.linked{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.linked .chip{font-size:.8rem}
.linked-acts{margin-left:auto}
.savehint{font-size:.82rem;margin-top:8px}
.savehint.dirty{color:var(--review)}
.today{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:14px;padding:16px 18px;margin:12px 0}
.today .lbl{font-size:.82rem;color:var(--muted);font-weight:600}
.today .what{font-size:1.1rem;font-weight:700;margin:4px 0 8px}
.dday{display:inline-flex;align-items:center;font-size:.82rem;font-weight:700;border-radius:8px;padding:3px 9px;background:var(--primary-soft);color:var(--primary)}
.dday.late{background:var(--review-bg);color:var(--review);box-shadow:inset 0 0 0 1px var(--review)}
.dday.soon{background:var(--review-bg);color:var(--review)}
.calc .row{display:grid;gap:4px;margin:10px 0}
.calc label,.fld label{font-weight:600;font-size:.95rem}
.calc .hint,.fld .hint{font-weight:400;color:var(--muted);font-size:.85rem}
.calc input,.fld input,.fld textarea,.fld select{width:100%;min-height:48px;border:1px solid #CBD5E1;border-radius:10px;padding:8px 12px;background:#fff}
.fld textarea{min-height:110px;resize:vertical;line-height:1.6}
.dtrow{display:flex;gap:8px}
.dtrow input{flex:1;min-width:0}
.dtrow .btn{flex:0 0 auto;min-height:48px}
.calc input:focus,.fld input:focus,.fld textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.dl-list{margin:12px 0 0}
.dl-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dl-item:first-child{border-top:0}
.dl-item .k{font-weight:600}
.dl-item .s{font-size:.82rem;color:var(--muted);font-weight:400;display:block}
.dl-item .v{font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 8px;position:sticky;top:var(--hdr);z-index:5;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;font-size:.82rem;line-height:1.3;color:var(--muted)}
.tab b{display:block;font-size:1.05rem;color:var(--ink)}
.tab .tc{display:block;font-size:.72rem;margin-top:2px}
.tab.on{border-color:var(--primary);background:var(--primary);color:#E3ECFA}
.tab.on b{color:#fff}
.tab.full{border-color:var(--ok)}
.tab.full:not(.on) .tc{color:var(--ok);font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:8px 0}
.panel-title{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;border-radius:8px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);background:#fff}
.tag.date{color:var(--ink);border-color:#CBD5E1}
.tag.rel{border-color:#A9C1E8;color:var(--primary);background:var(--primary-soft)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:0}
.todo input{width:22px;height:22px;flex:0 0 22px;margin-top:3px;accent-color:var(--primary);cursor:pointer}
.todo .tx{flex:1}
.todo.done .tx .m{color:var(--faint);text-decoration:line-through}
.todo .sub{display:block;font-size:.86rem;color:var(--muted)}
.todo .tag.rel{margin-left:6px;font-size:.72rem;padding:1px 6px;vertical-align:1px}
.panel details{margin-top:6px}
.forms{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.forms .fl{display:flex;gap:8px;align-items:flex-start}
.forms .fs{margin-top:4px;font-size:.82rem}
.forms a{color:var(--primary);font-weight:600;text-decoration:none}
.branch{font-size:.92rem;border-left:3px solid var(--no);background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav2 .btn{min-height:44px;flex:1;font-size:.92rem}
ul.plain{padding-left:1.1em;margin:.3em 0}
ul.plain li{margin:.3em 0}
.kv{border-top:1px solid var(--line);padding:10px 0}
.kv:first-child{border-top:0}
.kv b{display:block;font-weight:600}
.kv span{color:var(--muted);font-size:.92rem}

/* 사건 기록 */
.inc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.inc .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inc .ih b{font-size:1.05rem}
.fld{display:grid;gap:4px;margin:12px 0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.92rem;background:#fff}
.checks input{width:18px;height:18px;accent-color:var(--primary)}
.checks label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.doc{background:#fff;border:1px solid #CBD5E1;border-radius:6px;padding:20px;white-space:pre-wrap;font-size:.92rem;line-height:1.7;margin-top:10px;max-height:480px;overflow:auto}

/* 연락처 */
.call{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.call:first-of-type{border-top:0}
.call .who{font-weight:600}

const GLOSS_KEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function gl(html){
  let out = html; const used = new Set();
  GLOSS_KEYS.forEach(k=>{
    if(used.has(k)) return;
    const i = out.indexOf(k); if(i<0) return;
    const before = out.slice(0,i);
    if(before.lastIndexOf('<') > before.lastIndexOf('>')) return; // 태그 안이면 건너뜀
    if(/<button class="term"[^>]*>[^<]*$/.test(before)) return;
    out = before + `<button class="term" data-term="${k}">${k}</button>` + out.slice(i+k.length);
    used.add(k);
  });
  return out;
}

/* ========== 화면 이동 (뒤로가기 유지, URL 해시 없음, 미리보기 창 대응) ========== */
const app = document.getElementById('app');
let curState = {screen:'home', step:0};
let useHistory = true;
const memStack = [];
function hist(method, st){
  if(!useHistory) return false;
  try{ history[method](st, ''); return true; } catch(e){ useHistory = false; return false; }
}
function go(screen, step=0, opts={}){
  const st = Object.assign({screen, step}, opts);
  if(!hist('pushState', st)) memStack.push(curState);
  curState = st; render(st); window.scrollTo(0,0);
}
function goBack(){
  if(useHistory){ history.back(); return; }
  const prev = memStack.pop() || {screen:'home', step:0};
  curState = prev; render(prev); window.scrollTo(0,0);
}
window.addEventListener('popstate', e=>{
  const st = e.state;
  if(!st || st.screen === '__guard'){ hist('pushState', {screen:'home',step:0}); curState = {screen:'home',step:0}; render(curState); return; }
  curState = st; render(st); window.scrollTo(0,0);
});

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }
function setHdr(){ const h = document.getElementById('hdr'); if(h) document.documentElement.style.setProperty('--hdr', h.offsetHeight+'px'); }
const NAV_OF = {check:'check', result:'check', resume:'check', record:'record', teacher:'teacher', guide:'guide', print:'guide', types:'types'};
function render(st){
  const s = st.screen;
  closeTerm();
  app.classList.toggle('has-bar', s==='check');
  document.body.classList.toggle('with-bar', s==='check');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===NAV_OF[s]));
  if(s==='check') app.innerHTML = viewCheck(st.step||0, !!st.edit);
  else if(s==='result') app.innerHTML = viewResult();
  else if(s==='record') app.innerHTML = viewRecord();
  else if(s==='guide') app.innerHTML = viewGuide();
  else if(s==='teacher') app.innerHTML = viewTeacher();
  else if(s==='types') app.innerHTML = viewTypes();
  else if(s==='resume') app.innerHTML = viewResume();
  else if(s==='print') app.innerHTML = viewPrint();
  else app.innerHTML = viewHome();
  if(s==='guide') updateDeadlines();
  if(st.anchor){ const el = document.getElementById(st.anchor); if(el) setTimeout(()=>el.scrollIntoView({block:'start'}), 0); }
  // 쪽수 출처 표기를 원문 링크로
  app.querySelectorAll('.ref').forEach(r=>{ if(!r.querySelector('a')) r.innerHTML = `<a href="${SOURCE.url}" target="_blank" rel="noopener" title="교육부 원문 보기">${r.innerHTML}</a>`; });
  setHdr();
}

/* ========== 판별 질문 ========== */
function getQueue(a=answers){
  const q = ['ctx','actor'];
  if(!a.actor || a.actor==='colleague' || a.actor==='outsider') return q;
  q.push('acts');
  DETAIL_Q.forEach(k=>{ if(incQ(k, a)) q.push(k); });
  return q;
}
const STAGES = ['상황','행위자','있었던 일','자세히'];
function stageOf(id){ return id==='ctx'?0 : id==='actor'?1 : id==='acts'?2 : 3; }
function curVal(id){ if(id==='ctx'||id==='actor') return answers[id]; return answers.q[id]; }
function isAnswered(id){ return id==='acts' ? answers.acts.length>0 : curVal(id)!==undefined && curVal(id)!==null; }
function firstUnanswered(){ const q = getQueue(); const i = q.findIndex(id=>!isAnswered(id)); return i; }
function optLabel(id){
  if(id==='acts') return ACTS.filter(x=>answers.acts.includes(x.v)).map(x=>x.l).join(' / ');
  const o = Q[id].opts.find(o=>o.v===curVal(id)); return o ? o.l : '';
}
function viewCheck(step, edit){
  const queue = getQueue();
  if(step >= queue.length) return viewResult();
  const id = queue[step], d = Q[id], stg = stageOf(id);
  const details = queue.filter(k=>stageOf(k)===3), di = details.indexOf(id);
  const stagesHtml = STAGES.map((s,i)=>`<li class="${i<stg?'done':i===stg?'cur':''}"></li>`).join('');
  let body = '', canNext = false;
  if(id==='acts'){
    const avail = ACTS.filter(x=>!x.only || x.only===answers.actor);
    body = GROUPS.map(g=>{
      const items = avail.filter(x=>x.g===g.g); if(!items.length) return '';
      const n = items.filter(x=>answers.acts.includes(x.v)).length;
      const open = openGroups.has(g.g) || n>0;
      return `<details data-group="${g.g}" ${open?'open':''}><summary><span><span style="display:block">${esc(g.l)}</span>${g.s?`<span class="small muted" style="font-weight:400">${esc(g.s)}</span>`:''}</span><span class="cnt ${n?'':'zero'}" style="margin-left:auto">${n}</span></summary><div class="inner">
        ${items.map(x=>{ const sel = answers.acts.includes(x.v);
          return `<button class="opt multi ${sel?'sel':''}" data-action="toggleAct" data-v="${x.v}" aria-pressed="${sel}"><span class="mk"></span><span><span class="l">${esc(x.l)}</span>${x.s?`<span class="s">${esc(x.s)}</span>`:''}</span></button>`; }).join('')}
      </div></details>`; }).join('');
    canNext = answers.acts.length > 0;
  }else{
    const v = curVal(id);
    body = d.opts.map(o=>`<button class="opt ${v===o.v?'sel':''} ${o.unsure?'unsure':''}" data-action="answer" data-id="${id}" data-v="${o.v}" aria-pressed="${v===o.v}"><span class="mk"></span><span><span class="l">${esc(o.l)}</span>${o.s?`<span class="s">${esc(o.s)}</span>`:''}</span></button>`).join('');
    canNext = !!v;
  }
  const last = step === queue.length-1;
  let nextLabel = edit ? '고친 답으로 결과 보기' : (last ? '결과 보기' : '다음');
  if(id==='acts' && !edit) nextLabel = answers.acts.length ? `${answers.acts.length}개 선택 · 다음` : '하나 이상 고르세요';
  return `
  <ol class="stages" aria-hidden="true">${stagesHtml}</ol>
  <div class="stage-label"><span><b>${STAGES[stg]}</b>${stg===3?` ${di+1} / ${details.length}`:''}</span><span>${STAGES.slice(stg+1).concat('결과').join(' · ')}</span></div>
  ${edit?'<div class="editing">답을 고치는 중입니다</div>':''}
  <div class="q-title">${esc(d.title)}</div>
  ${d.help?`<div class="q-help">${esc(d.help)}</div>`:''}
  ${body}
  <div class="bar"><div class="wrap">
    <button class="btn ghost prev" data-action="back">${ic('arrowL')} 이전</button>
    <button class="btn next" data-action="next" ${canNext?'':'disabled'}>${nextLabel}${canNext?' '+ic('arrowR'):''}</button>
  </div></div>`;
}
function nextStep(step, edit){
  const queue = getQueue();
  if(edit){ const u = firstUnanswered(); if(u<0) go('result'); else go('check', u, {edit:true}); return; }
  if(step+1 >= queue.length) go('result'); else go('check', step+1);
}

function hasAnswers(){ return !!(answers.ctx || answers.actor || answers.acts.length); }
function viewResume(){
  const done = firstUnanswered() < 0;
  return `<h1>사례 점검</h1>

    }else add(9,'review',U+'녹음한 사람이 대화에 없던 사람(예: 보호자)이라면 통신비밀보호법 위반이 될 수 있습니다.',['record_who']);
    if(q.record_spread==='yes') add(15,'high','교육활동 중인 교원의 음성·영상을 무단으로 퍼뜨리면 이 유형에 해당할 수 있습니다.',Qs);
    else if(q.record_spread==='no'){ add(15,'no','퍼뜨리지 않았다면 무단 배포에는 해당하기 어렵습니다. 다만 교원의 음성권 침해 문제는 남습니다.',Qs); if(q.record_who!=='outsider') add(16,'review','동의 없는 녹음이 수업권을 침해했다면 학교장 판단으로 검토할 수 있습니다.',Qs); }
    else if(q.record_spread==='unsure') add(15,'review',U+'단체방·SNS 등에 올라갔다면 무단 배포에 해당할 수 있습니다.',Qs);
  }
  if(acts.includes('sexual')){
    const Qs=['sexual_kind'];
    if(q.sexual_kind==='crime'){ flags.urgent = true; flags.sexual = true; add(7,'high','강제추행, 몰래 촬영, 성적 합성물, 음란물 전송 등은 성폭력범죄에 해당할 수 있습니다. 성욕을 채우려는 목적이 없었다는 주장은 판단에 영향을 주지 않습니다.',Qs); }
    else if(q.sexual_kind==='conduct') add(12,'high','같은 처지의 평균적인 교원이 성적 굴욕감·혐오감을 느낄 만한 언동이라면 해당할 수 있습니다. 성적인 의도가 없었다는 주장은 판단에 영향을 주지 않습니다.',Qs);
    else { flags.urgent = true; add(7,'review',U+'강제 접촉, 몰래 촬영, 합성물·음란물이 있었다면 성폭력범죄입니다.',Qs); add(12,'review','그 밖의 성적인 말이나 행동으로 굴욕감·혐오감을 느꼈다면 성적 언동에 해당할 수 있습니다.',Qs); }
  }
  if(q.complaint_kind){
    const k = q.complaint_kind, rep = q.complaint_repeat, Qs=['complaint_kind','complaint_repeat'];
    if(k==='opinion') add(10,'no','보호자는 자녀 교육에 관해 학교에 의견을 낼 수 있고(교육기본법 제13조), 정당한 의견 제시나 정보 요청은 침해행위가 아닙니다.',['complaint_kind']);
    else if(k==='unsure') add(16,'review','어느 유형에도 딱 맞지 않더라도 교원의 정당한 권한을 침해하는 부당한 간섭이면 학교장 판단으로 다룰 수 있습니다.',Qs);
    else{
      const t = {harass:10, interfere:13, duty:11}[k];
      const msg = {harass:'교원을 괴롭히거나 특혜를 얻으려는 등 목적이 정당하지 않은 민원을 반복하면 해당할 수 있습니다.',
                   interfere:'교원의 정당한 교육적 판단에 반복적으로 간섭하면 해당할 수 있습니다. 담임 교체 요구는 비상적인 상황에서만 보충적으로 허용된다는 판례가 있습니다.',
                   duty:'교사의 직무나 교육과정에 없는 일을 계속 강요하면 해당할 수 있습니다.'}[k];
      if(rep==='yes') add(t,'high',msg,Qs);
      else if(rep==='no') add(t,'review', msg + ' 다만 이 유형은 반복 또는 지속이 요건이므로 한 번이라면 해당하기 어렵습니다.',Qs);
      else add(t,'review', msg + ' 요구를 받은 날짜와 방법을 정리해 몇 번이었는지 확인해 보세요.',Qs);
    }
  }
  if(acts.includes('disrupt')){
    const Qs=['disrupt_after','disrupt_count'];
    const af = q.disrupt_after, ct = q.disrupt_count;
    if(af==='stopped') add(14,'no','지도에 일단 따랐고 방해하지 않으려 했다면 의도적 방해로 보기 어렵습니다. 학칙과 「초·중등교육법」에 따른 생활지도·징계 대상입니다.',['disrupt_after']);
    else if(af==='escalated') add(14,'high','지도할수록 더 크게 방해했다면 방해 결과를 개의치 않는 태도로 보아 의도적 방해에 해당할 수 있습니다.',['disrupt_after']);
    else if(af==='continued'){
      if(ct==='repeat') add(14,'high','여러 차례 지도했는데도 같은 행동을 계속했다면 의도적 방해에 해당할 수 있습니다.',Qs);
      else add(14,'review','한 번의 불응이라면 우선 생활지도 대상입니다. 같은 일이 되풀이되는지 기록해 두세요.',Qs);
    }else add(14,'review',U+'의도성은 학생의 나이, 행동, 반복·지속 여부, 전후 정황을 종합해 판단합니다.',Qs);
  }
  if(acts.includes('other')) add(16,'review','법령에 정한 유형이 아니더라도 교권을 존중하지 않거나 정당한 권한을 침해하는 부당한 간섭이면 학교장이 판단해 침해행위로 볼 수 있습니다. 다른 유형에 준하는지 신중히 판단합니다.');

  const list = Object.values(R).sort((x,y)=> LV_RANK[y.level]-LV_RANK[x.level] || x.type-y.type);
  const live = t => R[t] && R[t].level!=='no';
  flags.violent = live(3) || live(7);
  flags.parent = a.actor==='parent' && list.some(r=>r.level!=='no');
  flags.crime = list.some(r=>CRIME_TYPES.includes(r.type) && r.level!=='no');
  flags.privateCtx = a.ctx==='private';
  const r = regionOf(region);
  if(a.ctx==='private') notes.push({top:true, cls:'gray', html:'<b>교육활동 중이 아닐 수 있습니다.</b> 교육활동과 관계없는 사적인 자리에서 생긴 일은 「교원지위법」상 침해행위로 다루지 않습니다. 범죄에 해당하면 경찰 신고 등 일반 절차를 이용할 수 있습니다.' + `<div class="ref">${ref('scope')}</div>`});
  if(a.ctx==='unsure') notes.push({top:true, cls:'gray', html:'<b>교육활동 중이었는지 확인해 보세요.</b> 수업·생활지도뿐 아니라 등·하교 지도, 쉬는 시간, 근무시간 외 학생 일 상담, SNS 게시물도 교육활동 중으로 볼 수 있습니다.' + `<div class="ref">${ref('scope')}</div>`});
  if(a.ctx==='afterhours') notes.push({html:'근무시간 외라도 학생·보호자 요청으로 학생 일을 상담하던 중이었다면 교육활동 중으로 볼 수 있습니다.' + `<div class="ref">${ref(5)}</div>`});
  if(a.ctx==='online') notes.push({html:'SNS 등에서의 모욕·명예훼손은 피해가 교육활동 시까지 이어지므로 교육활동 중인 교원에 대한 행위로 볼 수 있습니다.' + `<div class="ref">${ref(5)}</div>`});
  if(flags.violent && a.actor==='student') notes.push({html:'<b>학교장 긴급조치</b> 상해·폭행이나 성폭력범죄라면 학교장이 위원회 결정 전에 학교에서의 봉사, 특별교육·심리치료, 출석정지, 학급교체를 우선 부과할 수 있습니다. 출석정지·학급교체 전에는 의견 진술 기회를 주고, 부과 후 위원회에 즉시 보고해 추인을 받습니다.' + `<div class="ref">${ref('emergency')}</div>`});
  if(flags.violent) notes.push({html:'<b>특별휴가와 중대사안</b> 특별휴가는 5일 범위에, 상해·폭행이나 성폭력범죄면 5일 범위에서 더 받을 수 있습니다. 사망·4주 이상 치료 진단, 성폭력범죄는 교육부에 보고하는 중대사안입니다.' + `<div class="ref">${ref('leave')}</div>`});
  if(flags.msg) notes.push({html:'<b>중대사안 기준</b> 공포심·불안감을 주는 문자로 4주 이상 정신건강의학과 치료가 필요하다는 진단을 받으면 중대사안으로 보고됩니다.' + `<div class="ref">${ref(44)}</div>`});
  if(flags.parent) notes.push({html:'<b>보호자 등에 대한 조치</b> ① 서면사과 및 재발방지 서약 ② 특별교육 이수 또는 심리치료, 두 가지입니다. 정당한 사유 없이 특별교육·심리치료에 불참하면 300만 원 이하 과태료가 부과될 수 있습니다. 양측이 원하면 분쟁조정(개시 후 30일)도 이용할 수 있습니다.' + `<div class="ref">${ref('dispute')}</div>`});
  if(flags.crime){
    let h = '<b>형사 절차</b> 피해 선생님이 직접 경찰에 고소할 수 있습니다. 교육감이 고발할 수도 있으나 모욕처럼 피해자 고소가 필요한 친고죄와 14세 미만 학생은 고발 대상에서 제외됩니다.';
    if(a.actor==='student') h += ' 만 10세 이상 19세 미만 학생이라면 학교장 통고제도 있습니다.';
    notes.push({html: h + `<div class="ref">${ref('legal')}</div>`});
  }
  if(flags.report) notes.push({html:'<b>아동학대로 신고되었다면</b> 정당한 생활지도였는지 교육감이 조사·수사기관에 의견을 냅니다(신고 사항을 공유받은 날부터 7일 이내). 교육지원청의 확인서 작성에 자료를 내어 협조할 수 있습니다.' + `<div class="ref">${ref('childAbuse')}</div>`});
  return {list, notes, flags};
}

/* ========== 결과 ========== */
function assureHtml(){
  return `<div class="assure">${ic('shield')}<span><b>점검 결과와 관계없이 신고하고 상담받을 수 있습니다.</b> 침해행위인지는 지역교권보호위원회가 판단하며, 학교는 신고를 축소하거나 은폐할 수 없습니다(교원지위법 제27조).</span></div>`;
}
function basisHtml(qs){
  const rows = qs.filter(id=>getQueue().includes(id) && isAnswered(id));
  if(!rows.length) return '';
  return `<div class="basis"><div class="bt">이 판단에 쓰인 내 답</div>${rows.map(id=>`<div class="bl"><span>${esc(optLabel(id))}</span><button class="linkbtn" data-action="edit" data-q="${id}">고치기</button></div>`).join('')}</div>`;
}
function viewResult(){

    ${col?`<div class="card"><h3>이런 제도를 이용하세요</h3><p class="small muted">근무조건·인사·업무분장 갈등, 갑질 피해, 복무관리 지시 등은 아래 제도가 적합합니다.</p>
      <div class="kv"><b>고충심사청구 (국·공립 교원)</b><span>인사·처우 등 근무조건, 신상 문제</span></div>
      <div class="kv"><b>소청심사청구 (국·공립, 사립)</b><span>징계 등 불리한 처분, 30일 이내 청구</span></div>
      <div class="kv"><b>국가인권위원회 진정 (국·공립, 사립)</b><span>인권침해, 차별행위</span></div>
      <div class="kv"><b>직장 내 괴롭힘·갑질 신고</b><span>소속 교육(지원)청 담당 부서</span></div>
      <div class="ref">${ref('other')}</div></div>`
    :`<div class="now urgent"><h3>${ic('alert')} 위험하다면</h3><ol><li>주변 선생님이나 교무실에 도움을 청하고, 그 자리를 벗어나세요.</li><li>몸이 위험하면 112에 신고하세요.</li><li>학교 안에서 생긴 위협이라면 교원보호공제의 위협대처(경호) 서비스 대상이 될 수 있습니다.</li></ol><div class="ref">${ref('mutual')}</div></div>`}
    <div class="btn-row"><button class="btn ghost" data-action="edit" data-q="actor">${ic('arrowL')} 답 고치기</button><button class="btn" data-action="restart">처음부터 다시 점검</button></div>
    ${footer()}`;
  }
  const {list, notes, flags} = evaluate();
  const hi = list.filter(x=>x.level!=='no'), no = list.filter(x=>x.level==='no');
  const highs = list.filter(x=>x.level==='high'), reviews = list.filter(x=>x.level==='review');
  const urgent = flags.urgent && hi.length;
  let big;
  if(highs.length) big = `해당할 수 있는 유형 ${highs.length}개${reviews.length?`, 더 살펴볼 유형 ${reviews.length}개`:''}`;
  else if(reviews.length) big = `더 살펴볼 유형 ${reviews.length}개`;
  else big = '점검한 유형에는 잘 맞지 않았습니다';
  const chips = hi.map(x=>`<span class="chip lv-${x.level}">${esc(TYPES[x.type].name)}</span>`).join('');
  const hl = hotline(r);
  const now = urgent
    ? `<div class="now urgent"><h3>${ic('alert')} 지금 먼저 할 일</h3><ol>
        <li>멈춰 달라고 분명히 말하세요.</li>
        <li><b>옆 반 선생님이나 교무실에 도움을 청하거나</b>, 그 자리를 벗어나세요.</li>
        <li>몸이 위험하면 <b>112</b>에 신고하세요.</li>
        <li>진정된 뒤에는 교감·교장이나 담당자에게 알리고, 가해자와의 <button class="term" data-term="분리조치">분리</button>를 요청하세요. 메시지·사진·진단서 등 자료는 지우지 말고 보관하세요.</li></ol></div>`
    : `<div class="now"><h3>${ic('info')} 지금 할 일</h3><ol>
        <li>있었던 일을 날짜·시간·장소, 말과 행동 순서로 적어 두세요. <button class="linkbtn" data-action="nav" data-to="record">사건 기록하기</button></li>

      <details class="more"><summary>뜻과 매뉴얼 사례</summary><div class="inner">
        <p class="small"><b>근거</b> ${esc(t.law)}</p><p class="small">${gl(esc(t.concept))}</p>

        <div class="ref">${ref(t.page,'Ⅴ장 '+x.type+'번')}</div></div></details>
    </div>`; };
  const restNotes = notes.filter(n=>!n.top);
  const qList = getQueue();
  return `
  <h1>점검 결과</h1>
  ${notes.filter(n=>n.top).map(n=>`<div class="note ${n.cls}">${n.html}</div>`).join('')}
  <div class="summary"><div class="assure-line">${ic('shield')}<span><b>결과와 관계없이 신고·상담할 수 있습니다.</b> 판단은 지역교권보호위원회가 하며, 학교는 신고를 축소·은폐할 수 없습니다(교원지위법 제27조).</span></div>
    <div class="big">${big}</div>${chips?`<div class="chips big-chips">${chips}</div>`:''}
    <p class="small muted" style="margin:.8em 0 0">${hi.length?'매뉴얼 사례에 비춘 참고 결과입니다.':'이 도구가 묻는 유형에 맞지 않았을 뿐입니다. 다른 사정이 있거나 학교장 판단으로 다뤄질 수 있으니 담당자나 교육활동보호센터와 상의하세요.'}</p></div>
  ${now}
  ${hi.length?`<h2>유형별 판단</h2>${hi.map(card).join('')}`:''}

function resultText(){
  const {list, notes} = evaluate();
  const L = [];
  L.push('[교육활동 침해 판별 도우미 점검 결과]');
  getQueue().filter(isAnswered).forEach(id=>L.push(`- ${Q[id].title} → ${optLabel(id)}`));
  L.push('');
  list.forEach(x=>{ L.push(`■ ${TYPES[x.type].name} — ${LV_TXT[x.level]}`); x.why.forEach(w=>L.push('   · ' + w)); L.push('   (' + ref(TYPES[x.type].page,'Ⅴ장 '+x.type+'번') + ')'); });
  if(notes.length){ L.push(''); L.push('[함께 알아둘 것]'); notes.forEach(n=>L.push(' · ' + n.html.replace(/<div class="ref">.*?<\/div>/g,'').replace(/<[^>]+>/g,''))); }
  L.push(''); L.push('※ 참고 정보입니다. 점검 결과와 관계없이 신고·상담할 수 있으며, 최종 판단은 지역교권보호위원회가 합니다.'); L.push(`출처: ${SOURCE_TEXT}`); L.push(`원문: ${SOURCE.url}`);
  return L.join('\n');
}
function resultSnapshot(){
  if(!answers.actor || answers.actor==='colleague' || answers.actor==='outsider') return null;
  const {list, flags} = evaluate();
  return {types:list.filter(x=>x.level!=='no').map(x=>({name:TYPES[x.type].name, level:x.level})), flags:{violent:!!flags.violent, parent:!!flags.parent, crime:!!flags.crime, report:!!flags.report, privateCtx:!!flags.privateCtx}, at:fmt(new Date())};
}

function fmtDT(s){ if(!s) return ''; const d = new Date(s); if(isNaN(d)) return s; return fmt(d)+' '+hm(d); }
function recText(){
  const L = [], none = '(미기재)';
  L.push('교육활동 침해 사안 기록 — 사안 신고서 작성용 초안');
  L.push(`작성일: ${fmt(new Date())}`);
  L.push('※ 실명 대신 학생 A, 보호자 등으로 적었습니다.');
  L.push('');
  L.push('1. 개요');
  if(answers.ctx) L.push(`- 상황: ${optLabel('ctx')}`);
  if(answers.actor) L.push(`- 행위자: ${optLabel('actor')}`);
  if(answers.acts.length && answers.actor!=='colleague' && answers.actor!=='outsider'){
    L.push(`- 있었던 일: ${optLabel('acts')}`);
    const {list} = evaluate(); const hi = list.filter(x=>x.level!=='no');
    if(hi.length) L.push(`- 판별 도우미 점검 결과(참고): ${hi.map(x=>`${TYPES[x.type].name}(${LV_TXT[x.level]})`).join(', ')}`);
  }
  if(!answers.ctx && !answers.actor) L.push('- (사례 점검을 하면 개요가 함께 채워집니다)');
  L.push('');
  L.push(`2. 사건 경위 (${rec.incidents.length}건)`);
  rec.incidents.forEach((x,i)=>{
    L.push(`[사건 ${i+1}]`);
    L.push(`- 일시: ${fmtDT(x.dt)||none}`);
    L.push(`- 장소: ${x.place||none}`);
    L.push(`- 행위자: ${x.actor||none}`);
    L.push(`- 있었던 일: ${x.what||none}`);
    L.push(`- 목격자: ${x.witness||none}`);
    L.push(`- 증거 자료: ${x.evidence.length?x.evidence.join(', '):none}`);
    L.push(`- 피해: ${x.harm||none}`);
    L.push('');
  });
  L.push('3. 원하는 조치');
  L.push(rec.wants.length ? rec.wants.map(w=>'- '+w).join('\n') : '- '+none);
  L.push('');
  L.push('※ 이 초안을 학교의 「교육활동 침해 사안 신고서」(서식1)에 옮겨 적어 제출하세요. 점검 결과와 관계없이 신고할 수 있으며, 최종 판단은 지역교권보호위원회가 합니다.');
  L.push(`※ 참고: ${SOURCE_TEXT}`);
  return L.join('\n');
}

function caseFlags(c){ return (c.result && c.result.flags) || {}; }
function visTodos(s, c){ const f = caseFlags(c); return s.todos.filter(t=>!t[5] || t[6] || f[t[5]]); }
function isRel(t, c){ return t[5] && caseFlags(c)[t[5]]; }
function isCore(t, c){ return !!t[4] || isRel(t, c); }
function stepDone(s, c){ return visTodos(s,c).filter(t=>c.checks[t[0]]).length; }
function todoHtml(t, c){ return `<label class="todo ${c.checks[t[0]]?'done':''}"><input type="checkbox" data-check="${t[0]}" ${c.checks[t[0]]?'checked':''}><span class="tx"><span class="m">${esc(t[1])}</span>${isRel(t,c)?'<span class="tag rel">점검 결과 관련</span>':''}${t[2]?`<span class="sub">${esc(t[2])}</span>`:''}</span></label>`; }
function formsHtml(s){
  return `<div class="forms"><div class="fl">${ic('doc')}<span>${s.forms.map(n=>`서식${n} ${FORM_NAMES[n]}`).join(' · ')}</span></div>

}
function todayHtml(c){
  const out = calcDeadlines(c.dl).out;
  if(!c.dl.recv) return `<section class="today"><div class="lbl">오늘 할 일</div><div class="what">사안 접수 일시를 넣으세요.</div><div class="small muted" style="margin-bottom:8px">넣으면 다음 할 일과 남은 날짜가 여기에 나타납니다.</div><button class="btn ghost sm" data-action="toCalc">${ic('clock')} 접수 일시 넣기</button></section>`;
  let si = STEPS.findIndex(s=>visTodos(s,c).some(t=>isCore(t,c) && !c.checks[t[0]]));
  if(si<0) si = STEPS.findIndex(s=>visTodos(s,c).some(t=>!c.checks[t[0]]));
  if(si<0) return `<section class="today"><div class="lbl">오늘 할 일</div><div class="what">모든 할 일을 마쳤습니다.</div><div class="small muted">사안 파일을 저장해 두면 나중에 다시 확인할 수 있습니다.</div></section>`;
  const s = STEPS[si];
  const t = visTodos(s,c).find(t=>isCore(t,c) && !c.checks[t[0]]) || visTodos(s,c).find(t=>!c.checks[t[0]]);
  const o = out.find(x=>x.k===s.dlKey);
  let dd = '';
  if(o && o.d){
    const t0 = new Date(); t0.setHours(0,0,0,0); const d0 = new Date(o.d); d0.setHours(0,0,0,0);
    const n = Math.round((d0 - t0)/86400000);
    dd = n<0 ? `<span class="dday late">기한 ${-n}일 지남</span>` : n===0 ? `<span class="dday soon">오늘까지</span>` : `<span class="dday ${n<=2?'soon':''}">D-${n}</span>`;
  }
  return `<section class="today"><div class="lbl">오늘 할 일 · ${si+1}단계 ${esc(s.short)}</div>
    <div class="what">${esc(t[1])}</div>
    <div class="meta" style="margin:0">${o?`<span class="tag date">${ic('clock')} ${esc(o.v)}</span>`:''}${dd}
    <button class="btn ghost sm" data-action="tab" data-i="${si}" style="margin-left:auto">이 단계 보기 ${ic('arrowR')}</button></div></section>`;
}

/* ========== 날짜 계산 ========== */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ if(!s) return null; const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return new Date(+m[1], +m[2]-1, +m[3]); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function isOff(d){ const w = d.getDay(); return w===0 || w===6 || !!HOLIDAYS[ymd(d)]; }
function addBizDays(d, n){ let x = new Date(d), c = 0; while(c<n){ x = addDays(x,1); if(!isOff(x)) c++; } return x; }
const WD = ['일','월','화','수','목','금','토'];
function fmt(d){ return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.(${WD[d.getDay()]})`; }
function hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function calcDeadlines(dlo){
  const out = [];
  if(!dlo || !dlo.recv) return {out, warn:''};
  const recvDT = new Date(dlo.recv);
  if(isNaN(recvDT)) return {out, warn:''};
  const recv = parseDate(dlo.recv);
  const r24 = new Date(recvDT.getTime() + 24*3600*1000);
  out.push({k:'교육지원청 보고', v:`${fmt(r24)} ${hm(r24)}까지`, s:'접수 후 24시간', d:r24});
  const sep = addDays(recv,6);
  out.push({k:'분리조치 권장 최대 기간', v:`${fmt(sep)}까지`, s:'접수일에 결정했다고 가정, 첫날·휴일 포함 7일', d:sep});
  const rep5 = addBizDays(recv, 5);
  out.push({k:'사안 발생보고서 제출', v:fmt(rep5)+'까지', s:'보고 후 5일, 주말·공휴일 제외', d:rep5});
  const repBase = parseDate(dlo.report) || rep5;
  const com21 = addDays(repBase,21);
  out.push({k:'지역교권보호위원회 개최', v:fmt(com21)+'까지', s:(dlo.report?'발생보고서 제출일':'발생보고서 기한')+'부터 21일, 주말·공휴일 포함, 불가피하면 연장 가능', d:com21});
  const com = parseDate(dlo.committee);
  if(com){ const n14 = addDays(com,14); out.push({k:'조치 결과 통지', v:fmt(n14)+'까지', s:'위원회 조치 요청 후 14일, 주말·공휴일 포함', d:n14}); }
  const notice = parseDate(dlo.notice);
  if(notice){
    const n90 = addDays(notice,90);
    out.push({k:'미이행 여부 점검·보고', v:fmt(n90)+' 이후', s:'통지받은 날부터 90일이 지나도 미이행이면 명단 보고', d:n90});
    out.push({k:'행정심판 청구 기한(관련자 안내용)', v:fmt(n90)+'까지', s:'처분이 있음을 안 날부터 90일, 있은 날부터 180일 중 먼저 끝나는 날', d:n90});
  }
  const y = recv.getFullYear(), lastY = (notice||com||repBase).getFullYear();
  const warn = (!HOLIDAY_YEARS.includes(y) || !HOLIDAY_YEARS.includes(lastY)) ? `${HOLIDAY_YEARS.join('·')}년 밖의 날짜는 공휴일이 반영되지 않습니다. 코드의 HOLIDAYS 목록에 추가하세요.` : '';
  return {out, warn};
}
function updateDeadlines(){
  const el = document.getElementById('dlOut'); if(!el) return;
  const {out, warn} = calcDeadlines(curCase().dl);
  if(!out.length){ el.innerHTML = '<p class="small muted" style="margin:8px 0 0">접수 일시를 넣으면 단계별 기한이 나타납니다.</p>'; return; }
  el.innerHTML = `<div class="dl-list">${out.map(o=>`<div class="dl-item"><span><span class="k">${esc(o.k)}</span><span class="s">${esc(o.s)}</span></span><span class="v">${esc(o.v)}</span></div>`).join('')}</div>${warn?`<div class="note small">${esc(warn)}</div>`:''}`;
}

        <ul>${visTodos(s,c).map(t=>`<li>${c.checks[t[0]]?'☑':'☐'} ${esc(t[3])}${isRel(t,c)?' ★':''}</li>`).join('')}</ul>
        <div class="ps-f">서식: ${s.forms.map(n=>'서식'+n).join(', ')}</div></div>`).join('')}
      <div class="ps-step"><div class="h">하지 말아야 할 것</div><ul>${DONTS.map(d=>`<li>✕ ${esc(d)}</li>`).join('')}</ul></div>
    </div>
    <div class="ps-bottom"><b>갈림길</b> 위원회 미희망 → 양측 사안 종결 확인서(서식8), 이후 같은 사안 심의 요청 불가 · 오인 신고 → 피해교원 종결신청서 · 상해·폭행·성폭력 → 학교장 긴급조치 가능(위원회 즉시 보고·추인), 특별휴가 5일 추가 가능<br>
    <b>분리조치</b> 피해교원 의사 확인 → 최대 7일 권장(첫날·휴일 포함) → 관련 학생(보호자) 통보, 학습권 보장<br>
    <b>서식</b> 매뉴얼 부록 4 「각종 서식」(${MANUAL.pages.forms}쪽~) · ${caseFlags(c) && c.result ? '★ 점검 결과 관련 할 일 · ' : ''}<b>연락처</b> ${regionOf(region)?`${esc(regionOf(region).n)} 교육활동보호 ${hotline(regionOf(region))} · ${esc(regionOf(region).tel)}`:'지역번호+1395'} · 긴급 112</div>
    <div class="ps-src">출처: ${esc(SOURCE_TEXT)} 7, 29~65쪽(교육부 누리집 게시) · 참고용이며 최종 판단은 지역교권보호위원회가 합니다.</div>
  </div></div>`;
}

/* ========== 파일 저장 ========== */
function download(name, text, type){
  try{
    const blob = new Blob([text], {type});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return true;
  }catch(e){ toast('이 환경에서는 파일을 저장할 수 없습니다'); return false; }
}
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g,'_').slice(0,40);

/* ========== 용어 상자 ========== */
function openTerm(k){ const b = document.getElementById('termBox'); document.getElementById('termTxt').innerHTML = `<b>${esc(k)}</b>${esc(GLOSS[k]||'')}`; b.classList.add('on'); }
function closeTerm(){ const b = document.getElementById('termBox'); if(b) b.classList.remove('on'); }

/* ========== 저작권 안내 ========== */
function copyHtml(){
  return `<div class="mh"><h2 id="copyTitle">저작권 안내</h2><button data-action="closeCopy" aria-label="닫기">×</button></div>
  <dl>
    <dt>아이디어와 제작</dt>
    <dd>이 사이트의 아이디어·기획·구성은 최창훈의 것입니다. © 2026 최창훈</dd>
    <dt>사이트 코드와 글꼴</dt>
    <dd>HTML·CSS·JavaScript는 이 사이트를 위해 새로 작성했습니다. 외부 라이브러리, 웹폰트, 이미지를 불러오지 않으므로 별도로 고지할 오픈소스 라이선스가 없습니다. 글자는 사용자 기기에 설치된 기본 글꼴로 표시됩니다.</dd>
    <dt>아이콘과 기호</dt>
    <dd>아이콘은 이 사이트를 위해 직접 그린 단순한 도형(SVG)입니다. ☐ ★ → 「」 같은 기호는 유니코드 문자이며, 이모지 이미지는 쓰지 않았습니다.</dd>
    <dt>참고 자료</dt>
    <dd>판별 기준, 사례, 대응 절차는 ${esc(SOURCE_TEXT)}를 요약·재구성한 것입니다.<br>
      <span class="kogl">${esc(SOURCE.kogl)}</span><br>
      교육부가 창작한 이 저작물은 위 조건에 따라 출처를 밝히고 비영리로 이용합니다. <a href="${SOURCE.url}" target="_blank" rel="noopener">원문 보기</a></dd>
    <dt>법령과 판례</dt>
    <dd>법령·고시·판결은 저작권법 제7조에 따라 보호받지 않는 저작물입니다. 교육활동보호센터 연락처와 공휴일은 사실 정보입니다.</dd>
    <dt>공식 서비스 아님</dt>
    <dd>${esc(UNOFFICIAL)} 교육부 로고나 상징은 쓰지 않았습니다.</dd>
  </dl>
  <div class="btn-row" style="margin:18px 0 0"><button class="btn ghost" data-action="closeCopy">닫기</button></div>`;
}
let copyReturn = null;
function openCopy(){ const m = document.getElementById('copyModal'); document.getElementById('copyBox').innerHTML = copyHtml(); copyReturn = document.activeElement; m.classList.add('on'); const c = m.querySelector('[data-action=closeCopy]'); if(c) c.focus(); }
function closeCopy(){ const m = document.getElementById('copyModal'); if(!m.classList.contains('on')) return; m.classList.remove('on'); if(copyReturn && copyReturn.focus) copyReturn.focus(); }

/* ========== 이벤트 ========== */
document.addEventListener('click', e=>{
  const term = e.target.closest('.term'); if(term){ e.preventDefault(); openTerm(term.dataset.term); return; }
  if(!e.target.closest('#termBox')) closeTerm();
  document.querySelectorAll('details.kebab[open]').forEach(k=>{ if(!k.contains(e.target) || e.target.closest('.menu-pop button')) k.removeAttribute('open'); });
  const b = e.target.closest('[data-action]'); if(!b || b.disabled) return;
  const a = b.dataset.action, st = curState;
  if(a==='home') go('home');
  else if(a==='nav') go(b.dataset.to, 0, b.dataset.anchor ? {anchor:b.dataset.anchor} : {});
  else if(a==='back') goBack();
  else if(a==='closeTerm') closeTerm();
  else if(a==='openCopy') openCopy();
  else if(a==='toCalc'){ const el = document.getElementById('calc'); if(el){ el.scrollIntoView({block:'start'}); const i = document.getElementById('dlRecv'); if(i) setTimeout(()=>i.focus(), 300); } }
  else if(a==='closeCopy') closeCopy();
  else if(a==='startCheck'){ if(hasAnswers()) go('resume'); else go('check', 0); }
  else if(a==='resumeCheck'){ const u = firstUnanswered(); if(u<0) go('result'); else go('check', u); }
  else if(a==='newCheck'){ resetAnswers(); go('check', 0); }
  else if(a==='restart'){ resetAnswers(); go('check', 0); }
  else if(a==='answer'){
    const id = b.dataset.id, v = b.dataset.v;
    if(id==='ctx' || id==='actor'){
      if(id==='actor' && answers.actor!==v){ answers.acts = answers.acts.filter(x=>{ const o=ACTS.find(y=>y.v===x); return !o.only || o.only===v; }); }
      answers[id] = v;
    }else answers.q[id] = v;
    saveAnswers(); render(st);
  }
  else if(a==='toggleAct'){
    const v = b.dataset.v; const i = answers.acts.indexOf(v);
    openGroups.add(ACTS.find(x=>x.v===v).g);
    if(i>=0) answers.acts.splice(i,1); else answers.acts.push(v);
    saveAnswers(); const y = window.scrollY; render(st); window.scrollTo(0,y);
  }
  else if(a==='next') nextStep(st.step||0, !!st.edit);
  else if(a==='edit'){ const i = getQueue().indexOf(b.dataset.q); go('check', i<0?0:i, {edit:true}); }
  else if(a==='copyResult') copyText(resultText(), '결과를 복사했습니다');
  else if(a==='linkCase'){ const c = curCase(); c.result = resultSnapshot(); touchCase(); go('guide'); toast(`‘${c.name}’에 점검 결과를 연결했습니다`); }
  else if(a==='linkCaseHere'){ const c = curCase(); c.result = resultSnapshot(); touchCase(); render(st); toast('점검 결과를 연결했습니다'); }
  else if(a==='unlinkCase'){ const c = curCase(); c.result = null; touchCase(); render(st); }
  else if(a==='tab'){ const i = +b.dataset.i; if(i>=0 && i<STEPS.length){ const c = curCase(); c.tab = i; saveStore(); render(st);
      const t = document.querySelector('.tabs'); if(t) window.scrollTo(0, Math.max(0, t.getBoundingClientRect().top + window.scrollY - document.getElementById('hdr').offsetHeight - 8)); } }
  else if(a==='resetChecks'){
    const c = curCase();
    if(!Object.keys(c.checks).length){ toast('지울 체크 표시가 없습니다'); return; }
    if(!confirm(`‘${c.name}’의 체크 표시를 모두 지울까요?`)) return;
    c.checks = {}; touchCase(); render(st); toast('체크 표시를 모두 지웠습니다');
  }
  else if(a==='newCase'){
    const name = prompt('새 사안의 이름을 적어 주세요. (예: 10월 A건)\n학생·보호자 이름은 적지 마세요.', `사안 ${store.list.length+1}`);
    if(name===null) return; const c = newCaseObj(name.trim()||`사안 ${store.list.length+1}`);
    store.list.push(c); store.cur = c.id; saveStore(); render(st);
  }
  else if(a==='renameCase'){ const c = curCase(); const name = prompt('사안 이름', c.name); if(name===null || !name.trim()) return; c.name = name.trim(); touchCase(); render(st); }
  else if(a==='delCase'){
    const c = curCase(); if(!confirm(`‘${c.name}’을(를) 이 탭에서 지울까요? 저장한 사안 파일은 그대로 남습니다.`)) return;
    store.list = store.list.filter(x=>x.id!==c.id);
    if(!store.list.length){ const n = newCaseObj('사안 1'); store.list.push(n); }
    store.cur = store.list[0].id; saveStore(); render(st);
  }
  else if(a==='exportCase'){
    const c = curCase();
    const data = {app:'edu-protection-checker', version:1, savedAt:new Date().toISOString(), case:{name:c.name, checks:c.checks, dl:c.dl, tab:c.tab, result:c.result}};
    if(download(`교육활동침해_${safeName(c.name)}_${ymd(new Date())}.json`, JSON.stringify(data, null, 2), 'application/json')){ c.changed = false; saveStore(); render(st); toast('사안 파일을 저장했습니다'); }
  }
  else if(a==='importCase') document.getElementById('importFile').click();
  else if(a==='nowDT'){ const x = rec.incidents.find(i=>i.id===b.dataset.inc); if(x){ const d = new Date(); x.dt = ymd(d)+'T'+hm(d); saveRec(); const y = window.scrollY; render(st); window.scrollTo(0,y); } }
  else if(a==='addInc'){ rec.incidents.push(blankInc()); saveRec(); render(st); }
  else if(a==='delInc'){ if(!confirm('이 사건 기록을 지울까요?')) return; rec.incidents = rec.incidents.filter(x=>x.id!==b.dataset.id); saveRec(); render(st); }
  else if(a==='copyRec') copyText(recText(), '초안을 복사했습니다');
  else if(a==='saveRec') download(`교육활동침해_사건기록_${ymd(new Date())}.txt`, '﻿'+recText(), 'text/plain;charset=utf-8');
  else if(a==='clearRec'){ if(!confirm('사건 기록을 모두 지울까요?')) return; rec = {incidents:[blankInc()], wants:[]}; saveRec(); render(st); }
  else if(a==='print') window.print();
});
document.addEventListener('toggle', e=>{
  const d = e.target; if(d.dataset && d.dataset.group){ if(d.open) openGroups.add(d.dataset.group); else openGroups.delete(d.dataset.group); }
}, true);
function copyText(txt, msg){
  const done = ()=>toast(msg);
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(err){ toast('복사하지 못했습니다'); } document.body.removeChild(ta);
}
function onField(e){
  const t = e.target;
  if(t.matches('[data-dl]')){ const c = curCase(); c.dl[t.dataset.dl] = t.value; touchCase(); updateDeadlines();
    if(e.type==='change'){ const y = window.scrollY; render(curState); window.scrollTo(0,y); } return; }
  if(t.matches('[data-rec]')){ const x = rec.incidents.find(i=>i.id===t.dataset.inc); if(x){ x[t.dataset.rec] = t.value; saveRec(); refreshRecDoc(); } return; }
}
document.addEventListener('input', onField);
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.matches('[data-check]')){ const c = curCase(); if(t.checked) c.checks[t.dataset.check] = 1; else delete c.checks[t.dataset.check]; touchCase();
    const y = window.scrollY; render(curState); window.scrollTo(0,y); return; }
  if(t.matches('[data-region]')){ region = t.value; LS.set('ep_region', region); const y = window.scrollY; render(curState); window.scrollTo(0,y); return; }
  if(t.matches('[data-case]')){ store.cur = t.value; saveStore(); render(curState); return; }
  if(t.matches('[data-recev]')){ const x = rec.incidents.find(i=>i.id===t.dataset.inc); if(x){ const v = t.dataset.recev; x.evidence = t.checked ? [...new Set([...x.evidence, v])] : x.evidence.filter(z=>z!==v); saveRec(); refreshRecDoc(); } return; }
  if(t.matches('[data-want]')){ const v = t.dataset.want; rec.wants = t.checked ? [...new Set([...rec.wants, v])] : rec.wants.filter(z=>z!==v); saveRec(); refreshRecDoc(); return; }
  if(t.id==='importFile'){
    const f = t.files && t.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        if(data.app!=='edu-protection-checker' || !data.case) throw new Error('형식');
        const c = newCaseObj(String(data.case.name||'불러온 사안'));
        c.checks = data.case.checks||{}; c.dl = Object.assign(blankDl(), data.case.dl||{}); c.tab = +data.case.tab||0; c.result = data.case.result||null; c.changed = false;
        store.list.push(c); store.cur = c.id; saveStore(); render(curState); toast(`‘${c.name}’을(를) 불러왔습니다`);
      }catch(err){ toast('이 도구에서 저장한 사안 파일이 아닙니다'); }
      t.value = '';
    };
    rd.readAsText(f);
    return;
  }
  onField(e);
});
window.addEventListener('beforeunload', e=>{
  if(store.list.some(c=>c.changed && caseHasContent(c))){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('resize', setHdr);
document.getElementById('copyModal').addEventListener('click', e=>{ if(e.target.id==='copyModal') closeCopy(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeCopy(); closeTerm(); } });

/* ========== 시작 ========== */
(function init(){
  let st = null;
  try{ st = history.state; }catch(e){ useHistory = false; }
  if(st && st.screen && st.screen !== '__guard'){ curState = st; render(st); }
  else{ hist('replaceState', {screen:'__guard'}); hist('pushState', {screen:'home',step:0}); curState = {screen:'home',step:0}; render(curState); }
})();
</script>
